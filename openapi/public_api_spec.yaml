        origin:
          example: Public API
          type: string
          description: >
            Human-readable origin of the message, e.g. `Public API`, `Shared Inbox`,
            `Mass Messaging`, `Chrome Extension`, `synced from WhatsApp`, `Webhook`.
            Additional values are possible (e.g. from OIDC / connected third-party
