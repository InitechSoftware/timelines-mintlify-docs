      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
          example: Greeting
        text:
          type: string
          minLength: 1
          maxLength: 4096
          example: Hello
        visibility:
          allOf:
          - $ref: '#/components/schemas/TemplateVisibility'
